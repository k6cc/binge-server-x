# Builds + publishes binge-server release artefacts.
#
# Two parallel jobs:
#   - binaries: cross-compile for darwin/{arm64,amd64}, linux/{amd64,arm64},
#     windows/amd64 and attach to GitHub Releases.
#   - docker: build a multi-arch image and push to ghcr.io as
#     ghcr.io/<owner>/binge-server:<version> + :latest.
#
# Triggered by either:
#   - pushing a tag (v*) — version is derived from the tag name
#   - manual workflow_dispatch from the Actions UI (enter a version)
#     Go to Actions tab -> release -> Run workflow -> enter version -> Run.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g. v0.1.0-twitter)'
        required: true
        default: 'v0.1.0-twitter'
        type: string
  # Auto-trigger on tag push (e.g. v0.1.4-x). The version is resolved
  # from the tag name (env.VERSION below); manual workflow_dispatch still
  # works for ad-hoc builds where you want to pick the version label
  # yourself.
  push:
    tags:
      - 'v*'

# VERSION resolves to inputs.version on workflow_dispatch, or the tag
# name on tag push. Used by both jobs for naming binaries, the GitHub
# Release, and the docker image tag.
env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write   # for GitHub Releases
  packages: write   # for ghcr.io push

jobs:
  binaries:
    name: build all binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      # Build all 5 targets in a single job so there is only one
      # softprops/action-gh-release call (avoids the "release already
      # exists" race when multiple matrix jobs create the same tag).
      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          build_one() {
            local goos="$1" goarch="$2" ext="$3" archive="$4"
            echo "::group::Building ${goos}/${goarch}"
            GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath \
                -ldflags="-s -w -X main.Version=${VERSION}" \
                -o "dist/binge-server${ext}" .
            NAME="binge-server_${VERSION}_${goos}_${goarch}"
            STAGE="release/${NAME}"
            mkdir -p "${STAGE}"
            cp "dist/binge-server${ext}" "${STAGE}/"
            cp README.md LICENSE "${STAGE}/"
            cd release
            if [ "${archive}" = "zip" ]; then
              zip -r "../${NAME}.zip" "${NAME}"
            else
              tar -czf "../${NAME}.tar.gz" "${NAME}"
            fi
            cd ..
            rm -f "dist/binge-server${ext}"
            rm -rf "release/${NAME}"
            echo "::endgroup::"
          }
          build_one darwin arm64 ""      tar.gz
          build_one darwin amd64 ""      tar.gz
          build_one linux  amd64 ""      tar.gz
          build_one linux  arm64 ""      tar.gz
          build_one windows amd64 ".exe" zip

      - name: List artifacts
        run: ls -la *.zip *.tar.gz

      - name: Upload to Release (single call)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            binge-server_${{ env.VERSION }}_*.zip
            binge-server_${{ env.VERSION }}_*.tar.gz
          generate_release_notes: true

  docker:
    name: docker image (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}:${{ env.VERSION }}
            ${{ steps.image.outputs.ref }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
